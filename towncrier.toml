# Changelog fragments, assembled into CHANGELOG.md at release time.
# Rules: docs/contributing/changelog.md
# Preview: towncrier build --draft --version X.Y.Z

[tool.towncrier]
name = "ROTIFER"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/leepusp/rotifer/pull/{issue})"
underlines = ["", "", ""]
wrap = false
all_bullets = true
ignore = ["README.md"]

[[tool.towncrier.type]]
directory = "breaking"
name = "Upgrade notes"
showcontent = true

[[tool.towncrier.type]]
directory = "results"
name = "Changed results"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "dependencies"
name = "Dependencies"
showcontent = true
